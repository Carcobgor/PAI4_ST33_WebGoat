name: Pipeline DevSecOps - WebGoat

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # ETAPA 2: BUILD, SAST Y SCA (GATE A: AVISO)
  # ==========================================
  build-y-analisis-estatico:
    name: 2. Build, SAST y SCA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar WebGoat (MVN package)
        run: mvn --no-transfer-progress clean package -DskipTests

      # SAST: Semgrep (Modo aviso - Gate A)
      - name: SAST - Semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config=p/java --sarif --output=/src/semgrep-report.sarif /src

      # SCA: Trivy sobre dependencias Maven/pom.xml (Modo aviso - Gate A)
      - name: SCA - Trivy (Dependencias)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 --format json --output /src/trivy-sca-report.json /src
          head -c 200 "${{ github.workspace }}/trivy-sca-report.json"
  
      # Subir reportes generados
      - name: Guardar reportes estáticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-estaticos
          if-no-files-found: warn
          path: |
            semgrep-report.sarif
            trivy-sca-report.json

  # ==========================================
  # ETAPA 3: PRUEBAS DAST (GATE B: BLOQUEANTE)
  # ==========================================
  pruebas-dast:
    name: 3. Pruebas DAST (OWASP ZAP)
    needs: build-y-analisis-estatico
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar WebGoat en Docker
        run: |
          docker run -d --name webgoat -p 8080:8080 webgoat/webgoat:latest
          echo "Esperando a que WebGoat arranque..."
          sleep 35

      # DAST: OWASP ZAP Baseline Scan (Bloqueante si hay alertas WARN/FAIL)
      - name: DAST - OWASP ZAP Baseline Scan
        run: |
          chmod 777 "${{ github.workspace }}"
          docker run --rm --network=host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080/WebGoat \
            -x report_xml.xml -J report_json.json -r report_html.html

      - name: Guardar reporte DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-dast
          if-no-files-found: warn
          path: |
            report_xml.xml
            report_html.html

  # ==========================================
  # ENVÍO CENTRALIZADO A DEFECTDOJO (SIEMPRE)
  # ==========================================
  importar-defectdojo:
    name: Enviar informes a DefectDojo
    needs: [build-y-analisis-estatico, pruebas-dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los reportes
        uses: actions/download-artifact@v4

      - name: Subir SAST (Semgrep) a DefectDojo
        if: always()
        run: |
          FILE=$(find . -name "semgrep-report.sarif" | head -n 1)
          echo "Archivo SAST: $FILE"
          [ -n "$FILE" ] || exit 1
          CODE=$(curl -s -L -o resp_sast.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@$FILE" \
            -F "active=true" \
            -F "verified=true")
          echo "HTTP Status SAST: $CODE"
          cat resp_sast.txt
          [ "$CODE" -eq 201 ] || exit 1

      - name: Subir SCA (Trivy) a DefectDojo
        if: always()
        run: |
          FILE=$(find . -name "trivy-sca-report.json" | head -n 1)
          echo "Archivo SCA: $FILE"
          [ -n "$FILE" ] || exit 1
          CODE=$(curl -s -L -o resp_sca.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@$FILE" \
            -F "active=true" \
            -F "verified=true")
          echo "HTTP Status SCA: $CODE"
          cat resp_sca.txt
          [ "$CODE" -eq 201 ] || exit 1

      - name: Subir DAST (ZAP) a DefectDojo
        if: always()
        run: |
          FILE=$(find . -name "report_xml.xml" | head -n 1)
          echo "Archivo DAST: $FILE"
          [ -n "$FILE" ] || exit 1
          CODE=$(curl -s -L -o resp_dast.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=ZAP Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@$FILE" \
            -F "active=true" \
            -F "verified=true")
          echo "HTTP Status DAST: $CODE"
          cat resp_dast.txt
          [ "$CODE" -eq 201 ] || exit 1

  # ==========================================
  # ETAPA 4: PRODUCCIÓN EN RENDER (SI PASA GATE B)
  # ==========================================
  despliegue-produccion:
    name: 4. Despliegue en Render
    needs: pruebas-dast
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"